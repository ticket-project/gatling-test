plugins {
    id 'java'
    id 'io.gatling.gradle' version '3.15.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(io.gatling.gradle.GatlingRunTask).configureEach {
    def configuredReportDir = System.getProperty('gatlingReportDir')
    if (configuredReportDir != null && !configuredReportDir.isBlank()) {
        gatlingReportDir = file(configuredReportDir)
    } else {
        gatlingReportDir = file("$projectDir/../../distributed-results-join")
    }
}

tasks.register('gatlingReport', JavaExec) {
    group = 'gatling'
    description = 'Generates an HTML report from an existing Gatling simulation.log'
    dependsOn tasks.named('gatlingClasses')
    classpath = tasks.named('gatlingRun').get().gatlingRuntimeClasspath
    mainClass = 'io.gatling.app.Gatling'
    jvmArgs = gatling.jvmArgs
    ignoreExitValue = true

    doFirst {
        final String reportName = System.getProperty('gatlingReportName')
        final String reportRoot = System.getProperty('gatlingReportDir')
        if (reportName == null || reportName.isBlank()) {
            throw new GradleException('gatlingReportName system property is required')
        }
        if (reportRoot == null || reportRoot.isBlank()) {
            throw new GradleException('gatlingReportDir system property is required')
        }
        setArgs([
                '--reports-only', reportName,
                '--results-folder', file(reportRoot).absolutePath,
                '--launcher', 'gradle',
                '--build-tool-version', gradle.gradleVersion
        ])
    }
}

tasks.register('generateAccessTokens', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ticket.loadtest.AccessTokenFileGenerator'
    [
            'output',
            'tokenCount',
            'jwtSecret',
            'jwtIssuer',
            'syntheticMemberStartId',
            'syntheticJwtRole',
            'syntheticTokenTtlSeconds'
    ].each { propertyName ->
        def propertyValue = System.getProperty(propertyName)
        if (propertyValue != null) {
            systemProperty propertyName, propertyValue
        }
    }
}

dependencies {
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8:23.9.0.25.07'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('auditBookingDatabase', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ticket.loadtest.BookingDatabaseAuditMain'
    ['resultFile', 'performanceId', 'dbAuditOutput'].each { propertyName ->
        def propertyValue = System.getProperty(propertyName)
        if (propertyValue != null) {
            systemProperty propertyName, propertyValue
        }
    }
}
