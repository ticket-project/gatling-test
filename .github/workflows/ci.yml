name: CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: gatling-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gatling-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run Gatling project tests
        run: |
          chmod +x ./gradlew
          ./gradlew -p load-tests/gatling gatlingClasses test --no-daemon

  console-tests:
    # 콘솔은 로컬 Windows 도구라 테스트가 PowerShell 명령과 Windows 경로를 기대한다.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run console tests
        shell: bash
        run: |
          chmod +x ./console/gradlew
          ./console/gradlew -p console test --no-daemon
