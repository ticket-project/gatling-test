name: CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: gatling-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gatling-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run Gatling project tests
        run: |
          chmod +x ./gradlew
          ./gradlew -p load-tests/gatling test --no-daemon

  console-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run console tests
        run: |
          chmod +x ./console/gradlew
          ./console/gradlew -p console test --no-daemon
